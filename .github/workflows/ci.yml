name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen --dev

      - name: Lint with ruff
        run: uv run ruff check src/ tests/ evals/

      - name: Run tests (unit only — no external services)
        run: uv run pytest tests/test_chunker.py tests/test_syntax_chunkers.py tests/test_error_handling.py tests/test_generation_eval.py tests/test_memory.py tests/test_agent_router.py -v
        env:
          GEMINI_API_KEY: test-key
          QDRANT_URL: http://localhost:6333
