name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      qdrant:
        image: qdrant/qdrant:latest
        ports:
          - 6333:6333
        options: >-
          --health-cmd "bash -c 'echo > /dev/tcp/localhost/6333'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 10s

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync --dev

      - name: Run ingestion (seed Qdrant for tests)
        run: PYTHONPATH=. uv run python -m src.ingestion.pipeline
        env:
          QDRANT_URL: http://localhost:6333

      - name: Run tests
        run: uv run pytest -v
        env:
          QDRANT_URL: http://localhost:6333
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

