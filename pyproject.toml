[project]
name = "aeia"
version = "0.2.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
    "fastembed>=0.8.0",
    "flashrank>=0.2.10",
    "google-genai>=2.22.0",
    "langchain-text-splitters>=1.1.2",
    "onnxruntime>=1.29.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.3",
    "qdrant-client>=1.19.0",
    "rank-bm25>=0.2.2",
    "slowapi>=0.1.9",
    "uvicorn[standard]>=0.52.4",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

